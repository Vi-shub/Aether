[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-cuda",
    "crates/aether-kernels",
    "crates/aether-bridge",
    "crates/aether-bench",
    "crates/aether-python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aether Team"]
license = "Apache-2.0"
repository = "https://github.com/aether-runtime/aether"
description = "State-Aware AI Execution Runtime"
keywords = ["ai", "inference", "runtime", "llm", "gpu"]
categories = ["science", "simulation"]

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Data structures
dashmap = "5.5"
parking_lot = "0.12"
crossbeam = "0.8"
smallvec = "1.11"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Numerics
half = { version = "2.3", features = ["serde"] }
num-traits = "0.2"

# CUDA bindings
cudarc = { version = "0.10", optional = true }

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# CLI
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
tabled = "0.15"
rand = "0.8"

# Testing
criterion = "0.5"
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
